<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./icon-128.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Coding Professional Agent</title>
    <script>
      // Defend against Chromium 152 DevTools Live Metrics injected script bug (Chromium Issue 543499029, web-vitals Issue #792)
      window.addEventListener('error', function (event) {
        if (
          event &&
          event.message &&
          event.message.indexOf('startTime') !== -1 &&
          ((event.error && event.error.stack && event.error.stack.indexOf('reportAllChanges') !== -1) ||
            !event.filename ||
            event.filename.indexOf('VM') !== -1 ||
            event.filename === '<anonymous>')
        ) {
          event.preventDefault();
          if (typeof event.stopImmediatePropagation === 'function') {
            event.stopImmediatePropagation();
          }
        }
      }, true);
    </script>
    <style>
      /* Startup splash screen styles for immediate first paint without blank screen */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #06070f;
        overflow: hidden;
      }

      #startup-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #06070f;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
        transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      #startup-splash.splash-fade-out {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }

      .splash-ambient-glow {
        position: absolute;
        width: 520px;
        height: 260px;
        border-radius: 50%;
        background: radial-gradient(
          ellipse at center,
          rgba(56, 189, 248, 0.16) 0%,
          rgba(37, 99, 235, 0.09) 45%,
          transparent 72%
        );
        filter: blur(52px);
        animation: splash-glow-pulse 3.8s ease-in-out infinite alternate;
        pointer-events: none;
      }

      .splash-content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 24px;
        text-align: center;
      }

      .splash-logo-text {
        margin: 0;
        white-space: nowrap;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
        font-size: clamp(24px, 3.8vw, 34px);
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1.25;
        background: linear-gradient(
          115deg,
          #94a3b8 0%,
          #cbd5e1 20%,
          #ffffff 40%,
          #38bdf8 60%,
          #60a5fa 80%,
          #94a3b8 100%
        );
        background-size: 250% 100%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        color: transparent;
        animation: splash-shimmer 3s ease-in-out infinite;
        text-shadow: 0 0 32px rgba(56, 189, 248, 0.22);
      }

      @keyframes splash-shimmer {
        0% {
          background-position: 100% 0;
        }
        50% {
          background-position: 0% 0;
        }
        100% {
          background-position: -100% 0;
        }
      }

      @keyframes splash-glow-pulse {
        0% {
          transform: scale(0.85);
          opacity: 0.5;
        }
        100% {
          transform: scale(1.15);
          opacity: 0.95;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-ambient-glow,
        .splash-logo-text {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="startup-splash" aria-hidden="true">
      <div class="splash-ambient-glow"></div>
      <div class="splash-content">
        <h1 class="splash-logo-text">Coding Professional Agent</h1>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
